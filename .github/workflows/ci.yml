name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (all modules)
        run: |
          python -m py_compile steamrg.py ProxyPool.py ThreadManager.py SteamRegistration.py cli.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check . || true

  release-binary:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
      discussions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build GUI exe
        run: pyinstaller --noconfirm build.spec
      - name: Build CLI exe
        run: pyinstaller --onefile --console --name SteamRegister-CLI steamrg.py
      - name: Verify build outputs
        run: |
          if (-not (Test-Path dist/SteamRegister-GUI.exe)) { throw "GUI exe not found" }
          if (-not (Test-Path dist/SteamRegister-CLI.exe)) { throw "CLI exe not found" }
          Get-ChildItem dist/*.exe
      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: SteamRegister-windows-${{ github.ref_name }}
          path: |
            dist/SteamRegister-GUI.exe
            dist/SteamRegister-CLI.exe
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT || github.token }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SteamRegister-GUI.exe
            dist/SteamRegister-CLI.exe
          draft: false
          prerelease: false
          body: "自动构建的 Windows x64 可执行文件。GUI 版：SteamRegister-GUI.exe；命令行版：SteamRegister-CLI.exe。使用前需自行准备 config.json（或环境变量 CAPTCHA_API_KEY）与邮箱配置。"
      - name: Release fallback notice
        if: ${{ failure() }}
        run: echo "若上一步失败，说明仓库 Workflow permissions 仍不足或未配置 GH_RELEASE_PAT。exe 已保存在本 Run 的 Artifacts 中可直接下载。"
